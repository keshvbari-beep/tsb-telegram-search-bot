name: TSB Demo Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Demo Bot
        env:
          DEMO_BOT_TOKEN: ${{ secrets.DEMO_BOT_TOKEN }}
          DEMO_ADMIN_ID: ${{ secrets.DEMO_ADMIN_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python demo_bot.py
